<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>{{ titulo_pagina or "FonoApp" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d32f2f" />
    <link rel="icon" type="image/svg+xml" href="/static/img/splash.svg" />
    <link rel="shortcut icon" href="/static/img/splash.svg" />
    <link rel="apple-touch-icon" href="/static/img/splash.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css?v=9" />
    <style>body { font-family: 'Inter', 'Segoe UI', system-ui, Arial, sans-serif; }</style>
    <script>
    const FONOAPP_VOLUME_KEY = 'fonoapp_master_volume';
    const __fonoAudios = new Set();
    const __fonoAudioContexts = new Set();
    const __fonoAudioCleanup = new Set();

    function obtenerVolumenFono() {
        const guardado = parseFloat(localStorage.getItem(FONOAPP_VOLUME_KEY) || '0.7');
        if (Number.isNaN(guardado)) return 0.7;
        return Math.max(0, Math.min(1, guardado));
    }

    function actualizarEtiquetaVolumenFono(valor) {
        const label = document.getElementById('fono-volume-value');
        if (label) label.textContent = `${Math.round(valor * 100)}%`;
    }

    function registrarAudioFono(audio) {
        if (!audio) return audio;
        audio.volume = obtenerVolumenFono();
        __fonoAudios.add(audio);
        return audio;
    }

    function crearAudioFono(url) {
        return registrarAudioFono(new Audio(url));
    }

    function crearContextoAudioFono() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        const ctx = new Ctx();
        __fonoAudioContexts.add(ctx);
        return ctx;
    }

    function crearTonoFono(ctx, opciones) {
        if (!ctx) return null;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const inicio = opciones.startTime ?? ctx.currentTime;
        const duracion = opciones.duration ?? 0.5;
        const volumen = Math.max(0.0001, (opciones.volumeBase ?? 0.3) * obtenerVolumenFono());
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = opciones.frequency ?? 440;
        osc.type = opciones.type || 'sine';
        gain.gain.setValueAtTime(volumen, inicio);
        gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);
        osc.start(inicio);
        osc.stop(inicio + duracion);
        return { osc, gain };
    }

    function registrarLimpiezaSonido(fn) {
        if (typeof fn !== 'function') return;
        __fonoAudioCleanup.add(fn);
        return function cancelarRegistroLimpieza() {
            __fonoAudioCleanup.delete(fn);
        };
    }

    function detenerSonidosFono() {
        __fonoAudioCleanup.forEach(fn => {
            try { fn(); } catch (e) {}
        });
        __fonoAudios.forEach(audio => {
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        });
        __fonoAudioContexts.forEach(ctx => {
            try {
                if (ctx && typeof ctx.close === 'function' && ctx.state !== 'closed') {
                    ctx.close();
                }
            } catch (e) {}
        });
        __fonoAudios.clear();
        __fonoAudioContexts.clear();
    }

    async function subirEvidenciaAudio(blob, categoria, juego) {
        if (!blob || !blob.size) return '';
        const formData = new FormData();
        const extension = (blob.type || '').includes('ogg') ? 'ogg' : 'webm';
        formData.append('audio', blob, `${juego || 'actividad'}.${extension}`);
        formData.append('categoria', categoria || '');
        formData.append('juego', juego || '');
        const response = await fetch('/juegos/evidencia-audio', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('No se pudo subir la evidencia de audio');
        const data = await response.json();
        return data.audio_url || '';
    }

    function crearCapturaActividad(config) {
        let mediaRecorder = null;
        let stream = null;
        let chunks = [];
        let ultimoDetalle = {};

        async function iniciar() {
            if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return false;
            }
            if (mediaRecorder && mediaRecorder.state === 'recording') return true;
            chunks = [];
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) chunks.push(event.data);
            };
            mediaRecorder.start();
            return true;
        }

        async function detener(meta) {
            const extras = meta || {};
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                ultimoDetalle = {
                    ...ultimoDetalle,
                    audioTranscripcion: extras.transcripcion || ultimoDetalle.audioTranscripcion || '',
                    requiereRevisionAudio: !!(ultimoDetalle.audioUrl || extras.transcripcion),
                };
                return ultimoDetalle;
            }
            return await new Promise((resolve) => {
                const recorder = mediaRecorder;
                recorder.onstop = async () => {
                    let audioUrl = '';
                    try {
                        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                        audioUrl = await subirEvidenciaAudio(blob, config.categoria, config.juego);
                    } catch (e) {
                        console.warn('No se pudo subir la evidencia de audio:', e);
                    }
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                        stream = null;
                    }
                    mediaRecorder = null;
                    chunks = [];
                    ultimoDetalle = {
                        audioUrl,
                        audioTranscripcion: extras.transcripcion || '',
                        requiereRevisionAudio: !!(audioUrl || extras.transcripcion),
                    };
                    resolve(ultimoDetalle);
                };
                recorder.stop();
            });
        }

        function obtenerDetalle(meta) {
            const extras = meta || {};
            return {
                audioUrl: ultimoDetalle.audioUrl || '',
                audioTranscripcion: extras.transcripcion || ultimoDetalle.audioTranscripcion || '',
                requiereRevisionAudio: !!(ultimoDetalle.audioUrl || ultimoDetalle.audioTranscripcion || extras.transcripcion),
            };
        }

        function limpiar() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            mediaRecorder = null;
            chunks = [];
        }

        registrarLimpiezaSonido(limpiar);
        return { iniciar, detener, obtenerDetalle, limpiar };
    }

    function _renderizarControlVolumen() {
        const rutaActual = (window.location.pathname || '').replace(/\/+$/, '') || '/';
        if (!rutaActual.startsWith('/juegos/')) return;
        if (document.querySelector('.fono-volume-widget')) return;
        const valor = obtenerVolumenFono();
        const widget = document.createElement('div');
        widget.className = 'fono-volume-widget';
        widget.innerHTML = `
            <div class="fono-volume-head">
                <span>🔊 Volumen</span>
                <strong id="fono-volume-value">${Math.round(valor * 100)}%</strong>
            </div>
            <input id="fono-volume-slider" type="range" min="0" max="100" value="${Math.round(valor * 100)}" />
        `;
        widget.style.cssText = 'position:fixed;left:12px;right:12px;bottom:72px;z-index:9998;background:#ffffff;border:1px solid #f1d4d4;border-radius:14px;padding:0.65rem 0.85rem;box-shadow:0 5px 18px rgba(0,0,0,0.16);max-width:360px;margin:0 auto;';
        const esMovil = window.matchMedia('(max-width: 768px)').matches;
        if (!esMovil) {
            widget.style.left = '14px';
            widget.style.right = 'auto';
            widget.style.bottom = '14px';
            widget.style.width = '240px';
        }
        document.body.appendChild(widget);
        const slider = document.getElementById('fono-volume-slider');
        slider.addEventListener('input', function() {
            const nuevoValor = Math.max(0, Math.min(1, Number(this.value) / 100));
            localStorage.setItem(FONOAPP_VOLUME_KEY, String(nuevoValor));
            actualizarEtiquetaVolumenFono(nuevoValor);
            __fonoAudios.forEach(audio => { audio.volume = nuevoValor; });
        });
    }

    /**
     * Guarda el resultado de un juego en la base de datos.
     * Llamar desde cualquier juego cuando el paciente lo complete.
     * @param {string} categoria - Categoría del juego (respiracion, fonacion, etc.)
     * @param {string} juego - Nombre del juego (globo, gol, etc.)
     * @param {number} pasoCompletado - Último paso completado
     * @param {number} totalPasos - Total de pasos del juego
     * @param {boolean} completado - Si el juego fue completado
     * @param {number} puntos - Puntos obtenidos (opcional)
     * @param {number} nivel - Nivel del paciente (opcional)
     */
    function guardarResultadoJuego(categoria, juego, pasoCompletado, totalPasos, completado, puntos=0, nivel=1, detalles={}) {
        // El backend toma el email desde la sesión firmada.
        // Este valor solo se envía como respaldo para compatibilidad.
        let email = sessionStorage.getItem('paciente_email')
                 || localStorage.getItem('paciente_email_actual');
        if (!email) {
            const urlParams = new URLSearchParams(window.location.search);
            email = urlParams.get('email');
        }
        if (!email) email = '';
        const formData = new FormData();
        formData.append('paciente_email', email);
        formData.append('categoria', categoria);
        formData.append('juego', juego);
        formData.append('paso_completado', pasoCompletado);
        formData.append('total_pasos', totalPasos);
        formData.append('completado', completado);
        formData.append('puntos', puntos);
        formData.append('nivel', nivel);
        formData.append('ruta', window.location.pathname || '');
        formData.append('notas', detalles.notas || '');
        formData.append('audio_transcripcion', detalles.audioTranscripcion || '');
        formData.append('audio_url', detalles.audioUrl || '');
        formData.append('requiere_revision_audio', detalles.requiereRevisionAudio ? 'true' : 'false');
        return fetch('/juegos/resultado', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (completado) {
                    const completadas = JSON.parse(sessionStorage.getItem('actividades_hoy_completadas') || '[]');
                    const ruta = (window.location.pathname || '').replace(/\/+$/, '');
                    if (!completadas.includes(ruta)) {
                        completadas.push(ruta);
                        sessionStorage.setItem('actividades_hoy_completadas', JSON.stringify(completadas));
                        localStorage.setItem('actividades_hoy_completadas', JSON.stringify(completadas));
                    }
                }
                console.log('Resultado guardado:', data);
            })
            .catch(e => console.warn('No se pudo guardar resultado:', e));
    }

    // Función global para volver al inicio (dashboard del usuario)
    function volverInicio() {
        detenerSonidosFono();
        const origen = sessionStorage.getItem('juegos_origen');
        window.location.href = origen || '/paciente/perfil';
    }

    const ORDEN_JUEGOS = [
        '/juegos/respiracion/globo',
        '/juegos/respiracion/molino',
        '/juegos/fonacion/gol',
        '/juegos/fonacion/escala',
        '/juegos/resonancia/escaleras',
        '/juegos/resonancia/piano',
        '/juegos/resonancia/veoveo',
        '/juegos/articulacion/letra-b',
        '/juegos/articulacion/letra-d',
        '/juegos/articulacion/letra-f',
        '/juegos/articulacion/letra-r',
        '/juegos/articulacion/completa-palabra',
        '/juegos/articulacion/moto-voz',
        '/juegos/prosodia/adivina-animal',
        '/juegos/prosodia/trabalenguas',
        '/juegos/prosodia/adivinanza-imagen',
        '/juegos/prosodia/completa-cancion',
        '/juegos/discriminacion/sonidos-animales',
        '/juegos/discriminacion/sonidos-objetos',
        '/juegos/discriminacion/arrastra-sonido',
        '/juegos/practica/rompecabezas',
        '/juegos/practica/cara',
        '/juegos/practica/asociacion',
    ];

    function _normalizarRuta(path) {
        if (!path) return '/';
        let normalizada = path;
        try {
            if (typeof path === 'string' && /^https?:\/\//i.test(path)) {
                normalizada = new URL(path).pathname || '/';
            }
        } catch (e) {}
        normalizada = (normalizada || '').split('?')[0].split('#')[0];
        return normalizada.replace(/\/+$/, '') || '/';
    }

    function _leerListaActividadesHoy() {
        try {
            const rawSession = sessionStorage.getItem('actividades_hoy_urls');
            const rawLocal = localStorage.getItem('actividades_hoy_urls');
            const lista = JSON.parse(rawSession || rawLocal || '[]');
            return Array.isArray(lista) ? lista.map(_normalizarRuta) : [];
        } catch (e) {
            return [];
        }
    }

    function _leerCompletadasHoy() {
        try {
            const rawSession = sessionStorage.getItem('actividades_hoy_completadas');
            const rawLocal = localStorage.getItem('actividades_hoy_completadas');
            const lista = JSON.parse(rawSession || rawLocal || '[]');
            return Array.isArray(lista) ? lista.map(_normalizarRuta) : [];
        } catch (e) {
            return [];
        }
    }

    function obtenerSiguienteJuego(rutaActual) {
        const limpia = (rutaActual || '').replace(/\/+$/, '') || '/';
        const idx = ORDEN_JUEGOS.indexOf(limpia);
        if (idx < 0 || idx >= ORDEN_JUEGOS.length - 1) return null;
        return ORDEN_JUEGOS[idx + 1];
    }

    function irSiguienteJuego() {
        detenerSonidosFono();
        const rutaActual = _normalizarRuta(window.location.pathname);
        const modoFlujo = sessionStorage.getItem('flujo_juegos_modo') || '';
        if (modoFlujo === 'actividades_hoy') {
            const listaHoy = _leerListaActividadesHoy();
            const completadasHoy = new Set(_leerCompletadasHoy());
            if (listaHoy.length) {
                const pendientes = listaHoy.filter(url => !completadasHoy.has(url));
                const idxActual = listaHoy.indexOf(rutaActual);
                if (idxActual >= 0) {
                    const siguienteDelDia = listaHoy[idxActual + 1];
                    if (siguienteDelDia) {
                        window.location.href = siguienteDelDia;
                        return;
                    }
                    if (!pendientes.length) {
                        sessionStorage.setItem('flujo_juegos_modo', 'hub');
                    } else {
                        const siguientePendiente = pendientes.find(url => url !== rutaActual) || pendientes[0];
                        if (siguientePendiente && siguientePendiente !== rutaActual) {
                            window.location.href = siguientePendiente;
                            return;
                        }
                    }
                } else {
                    // Si no reconocemos la ruta actual, mantenemos el flujo diario
                    // y llevamos al siguiente pendiente en vez de saltar a flujo libre.
                    if (pendientes.length) {
                        window.location.href = pendientes[0];
                        return;
                    }
                    sessionStorage.setItem('flujo_juegos_modo', 'hub');
                }
                if (modoFlujo === 'actividades_hoy' && listaHoy.length) {
                    const pendientesPost = listaHoy.filter(url => !completadasHoy.has(url));
                    if (pendientesPost.length) {
                        window.location.href = pendientesPost[0];
                        return;
                    }
                }
                if (!pendientes.length) {
                    sessionStorage.setItem('flujo_juegos_modo', 'hub');
                } else {
                    return;
                }
            }
        }

        const siguiente = obtenerSiguienteJuego(rutaActual);
        if (siguiente) {
            window.location.href = siguiente;
            return;
        }
        const origen = sessionStorage.getItem('juegos_origen');
        window.location.href = origen || '/juegos/';
    }

    function _mostrarAnuncioGlobal() {
        const clave = 'anuncio_global_visto';
        fetch('/juegos/anuncio-activo')
            .then(r => r.json())
            .then(data => {
                const anuncio = data && data.anuncio;
                if (!anuncio || !anuncio.texto) return;
                const firma = `${anuncio.tipo || 'aviso'}:${anuncio.texto}`;
                if (sessionStorage.getItem(clave) === firma) return;
                const burbuja = document.createElement('div');
                burbuja.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:10000;background:#fffbe7;border:1px solid #ffd54f;border-left:4px solid #f57c00;border-radius:10px;padding:0.75rem 0.85rem;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:0.85rem;';
                burbuja.innerHTML = `<strong style="color:#d32f2f;display:block;margin-bottom:0.2rem;">${(anuncio.tipo || 'Aviso').toString().toUpperCase()}</strong><span style="color:#444;">${anuncio.texto}</span><button style="float:right;border:none;background:none;color:#999;font-weight:700;cursor:pointer;">✕</button>`;
                const btnCerrar = burbuja.querySelector('button');
                btnCerrar.onclick = function() {
                    burbuja.remove();
                    sessionStorage.setItem(clave, firma);
                };
                document.body.appendChild(burbuja);
            })
            .catch(() => {});
    }

    // Controlar el splash screen
    var splashTimerSet = false;
    
    document.addEventListener('DOMContentLoaded', function() {
        if (splashTimerSet) return; // Evitar ejecutar múltiples veces
        splashTimerSet = true;
        
        const splash = document.getElementById('splash');
        if (splash) {
            // Después de 2.5 segundos, ocultar el splash
            setTimeout(function() {
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                splash.style.pointerEvents = 'none';
                
                // Remover del DOM después del fade
                setTimeout(function() {
                    if (splash && splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                }, 600);
            }, 2500);
        }

        const rutaActual = _normalizarRuta(window.location.pathname);
        const esHubOJuegosCategoria = /^\/juegos(\/(respiracion|fonacion|resonancia|articulacion|prosodia|discriminacion|practica))?$/.test(rutaActual);
        if (esHubOJuegosCategoria) {
            sessionStorage.setItem('flujo_juegos_modo', 'hub');
        }

        _renderizarControlVolumen();

        // Auto-agregar botón "Siguiente" en páginas de juegos
        const esPantallaJuego = rutaActual.startsWith('/juegos/') && rutaActual !== '/juegos/';
        if (esPantallaJuego && !document.querySelector('.btn-continuar-global')) {
            const btnContinuar = document.createElement('button');
            btnContinuar.className = 'btn-continuar-global boton-rojo';
            const esMovil = window.matchMedia('(max-width: 768px)').matches;
            btnContinuar.style.cssText = esMovil
                ? 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:0.78rem 1rem;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.2);font-size:0.95rem;font-weight:700;'
                : 'position:fixed;right:14px;bottom:14px;z-index:9999;padding:0.65rem 1rem;border:none;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.2);';
            const modoFlujo = sessionStorage.getItem('flujo_juegos_modo') || '';
            if (modoFlujo === 'actividades_hoy') {
                const listaHoy = _leerListaActividadesHoy();
                const pendientes = listaHoy.filter(url => !_leerCompletadasHoy().includes(url));
                const idxActual = listaHoy.indexOf(rutaActual);
                btnContinuar.textContent = (!pendientes.length || idxActual >= listaHoy.length - 1) ? 'Siguiente libre' : 'Siguiente actividad';
            } else {
                btnContinuar.textContent = obtenerSiguienteJuego(window.location.pathname) ? 'Siguiente' : 'Finalizar';
            }
            btnContinuar.onclick = irSiguienteJuego;
            document.body.appendChild(btnContinuar);
        }

        if (window.location.pathname.startsWith('/doctor/')) {
            _inicializarNotificacionesDoctor();
        }

        _mostrarAnuncioGlobal();
    });
    window.addEventListener('pagehide', detenerSonidosFono);
    window.addEventListener('beforeunload', detenerSonidosFono);

    function _inicializarNotificacionesDoctor() {
        if (document.querySelector('.fono-doctor-notify')) return;
        const banner = document.createElement('div');
        banner.className = 'fono-doctor-notify';
        banner.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#fff;border:1px solid #d9e6ff;border-radius:12px;padding:0.7rem 0.85rem;box-shadow:0 5px 18px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:space-between;gap:0.6rem;';
        banner.innerHTML = '<span style="font-size:0.82rem;color:#1f3b73;font-weight:600;">Activa las notificaciones del navegador para nuevos avances de pacientes.</span><button type="button" class="boton-rojo" style="margin:0;padding:0.45rem 0.7rem;">Activar</button>';
        if ('Notification' in window && Notification.permission === 'default') {
            document.body.appendChild(banner);
            banner.querySelector('button').onclick = async function() {
                const permiso = await Notification.requestPermission();
                if (permiso !== 'default') banner.remove();
            };
        }

        if (!('Notification' in window)) return;
        const revisar = () => {
            if (Notification.permission !== 'granted') return;
            fetch('/doctor/notificaciones/pending')
                .then(r => r.ok ? r.json() : { items: [] })
                .then(data => {
                    (data.items || []).forEach(item => {
                        const cuerpo = `${item.paciente_email} completó ${item.actividad} (${item.categoria}). Puntaje: ${item.puntaje_actividad}.`;
                        new Notification('Nuevo avance de paciente', { body: cuerpo, icon: '/static/img/splash.svg' });
                    });
                })
                .catch(() => {});
        };
        revisar();
        setInterval(revisar, 45000);
    }
    </script>
    <script src="/static/js/terminos.js"></script>
</head>
<body class="fondo-blanco">
    <div class="contenedor-principal">
        {% block contenido %}{% endblock %}
    </div>
</body>
