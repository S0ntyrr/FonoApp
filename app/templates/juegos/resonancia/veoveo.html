<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{{ titulo_pagina }}</title>
  <link rel="stylesheet" href="/static/css/estilos.css">
  <script src="/static/js/juego-audio-utils.js"></script>
  <script>
  function guardarResultadoJuego(cat,juego,paso,total,completado,puntos=0,nivel=1,detalles={}){
    const email=sessionStorage.getItem("paciente_email")||localStorage.getItem("paciente_email_actual")||"";
    const fd=new FormData();fd.append('paciente_email',email);fd.append('categoria',cat);
    fd.append('juego',juego);fd.append('paso_completado',paso);fd.append('total_pasos',total);
    fd.append('completado',completado);fd.append('puntos',puntos);fd.append('nivel',nivel);fd.append('ruta',window.location.pathname||'');
    fd.append('audio_transcripcion', detalles.audioTranscripcion || '');
    fd.append('audio_url', detalles.audioUrl || '');
    fd.append('requiere_revision_audio', detalles.requiereRevisionAudio ? 'true' : 'false');
    fetch('/juegos/resultado',{method:'POST',body:fd}).catch(e=>console.warn(e));
    if (completado && typeof reproducirSonidoExito === 'function') reproducirSonidoExito();
  }
  </script>
  <style>
    /* mobile container */
    body { margin:0; background:#fff; font-family: 'Segoe UI', sans-serif; }
    .screen { max-width:430px; margin:0 auto; min-height:100vh; padding:16px; box-sizing:border-box; }
    h1.cat-title { color:#e63946; text-align:center; font-size:1.4rem; border-bottom:2px solid #e63946; padding-bottom:8px; }
    /* Phase 1 */
    .target-box { text-align:center; margin:12px 0; }
    .target-img { font-size:3rem; }
    .grid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:12px; }
    .grid-item { font-size:2.2rem; cursor:pointer; padding:6px; border-radius:8px; transition:background .2s; }
    .grid-item:hover { background:#ffeaea; }
    .grid-item.correct { background:#c8f7c5; border:2px solid #27ae60; }
    /* Phase 2 */
    .phase2 { display:none; text-align:center; }
    .phase2.active { display:block; }
    .phase1.hidden { display:none; }
    .word-label { font-size:2rem; font-weight:bold; color:#e63946; margin:16px 0; }
    .mic-btn { background:#e63946; color:#fff; border:none; border-radius:50%; width:60px; height:60px; font-size:1.8rem; cursor:pointer; margin:12px auto; display:block; }
    .feedback { color:#27ae60; font-size:1.3rem; font-weight:bold; margin-top:12px; display:none; }
  </style>
</head>
<body>
<div class="screen">
  <h1 class="cat-title">Resonancia</h1>

  <!-- PHASE 1 -->
  <div class="phase1" id="phase1">
    <h2 style="text-align:center;">¡Veo, veo!</h2>
    <p>Encuentra la imagen que se muestra.</p>
    <div class="target-box">
      <div class="target-img">🪆</div>
    </div>
    <div class="grid" id="grid">
      <!-- items injected by JS -->
    </div>
  </div>

  <!-- PHASE 2 -->
  <div class="phase2" id="phase2">
    <h2 style="color:#e63946;">Muy bien</h2>
    <p>¿cómo se llama?</p>
    <button class="mic-btn" id="mic1" title="Grabar">🎤</button>
    <p id="mic1-estado" style="text-align:center;font-size:0.8rem;color:#888;min-height:1.2em;"></p>
    <p>Vamos, repite conmigo.<br>Es una:</p>
    <div class="word-label">MUÑECA</div>
    <div style="font-size:4rem;">🪆</div>
    <button class="mic-btn" id="mic2" title="Grabar">🎤</button>
    <p id="mic2-estado" style="text-align:center;font-size:0.8rem;color:#888;min-height:1.2em;"></p>
    <div class="feedback" id="feedback">¡Muy bien! 🎉</div>
    <a href="/juegos/articulacion/letra-b" id="btn-continuar-veoveo" style="display:none;background:#e63946;color:#fff;border-radius:12px;padding:12px 14px;text-decoration:none;text-align:center;margin:16px auto 0;max-width:260px;">Siguiente</a>
    <div style="margin-top:24px;">
      <a href="/juegos/resonancia" style="display:block;text-align:center;color:#e63946;">← Volver a Resonancia</a>
    </div>
  </div>
</div>

<script>
const items = ['🏔️','🎀','🏠','☀️','🕷️','🌸','🌳','👦','🎩','☂️','🌈','🐭','🍍','🪆','🌺'];
const target = '🪆';
const grid = document.getElementById('grid');

// Shuffle
items.sort(() => Math.random() - 0.5);
items.forEach(em => {
  const div = document.createElement('div');
  div.className = 'grid-item';
  div.textContent = em;
  div.addEventListener('click', () => {
    if (em === target) {
      div.classList.add('correct');
      setTimeout(() => {
        document.getElementById('phase1').classList.add('hidden');
        document.getElementById('phase2').classList.add('active');
      }, 600);
    } else {
      div.style.background = '#ffd6d6';
      setTimeout(() => div.style.background = '', 500);
    }
  });
  grid.appendChild(div);
});

// Mic buttons (grabación real + reconocimiento de voz)
const evidenciaVozVeoVeo = (typeof crearCapturaActividad === 'function') ? crearCapturaActividad({ categoria: 'resonancia', juego: 'veoveo' }) : {
  iniciar: async () => ({}),
  detener: async (meta = {}) => ({ audioUrl: '', audioTranscripcion: meta.transcripcion || '', requiereRevisionAudio: !!(meta.transcripcion) })
};
let resultadoVeoVeoGuardado = false;
let ultimaTranscripcionVeoVeo = '';

function normalizarTextoVeoVeo(texto) {
  return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

async function toggleMic(btn, estadoEl) {
  if (btn.dataset.done === 'true') return;
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    estadoEl.textContent = 'Tu navegador no soporta reconocimiento de voz.';
    estadoEl.style.color = '#d32f2f';
    return;
  }
  btn.textContent = '⏹️';
  btn.style.background = '#27ae60';
  estadoEl.textContent = 'Escuchando: "muñeca"...';
  estadoEl.style.color = '#333';
  try { if (typeof evidenciaVozVeoVeo.iniciar === 'function') await evidenciaVozVeoVeo.iniciar(); } catch (e) {}
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'es-ES';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onresult = async (event) => {
    const texto = Array.from(event.results).map((r) => r[0].transcript).join(' ').trim();
    ultimaTranscripcionVeoVeo = texto;
    const normalizado = normalizarTextoVeoVeo(texto);
    if (normalizado.includes('muneca') || normalizado.includes('munieca')) {
      btn.dataset.done = 'true';
      btn.textContent = '✓';
      estadoEl.textContent = `✅ Dijiste: "${texto}"`;
      estadoEl.style.color = '#27ae60';
      let detalle = { audioUrl: '', audioTranscripcion: texto, requiereRevisionAudio: true };
      try { detalle = await evidenciaVozVeoVeo.detener({ transcripcion: texto }); } catch (e) {}
      document.getElementById('feedback').style.display = 'block';
      if (!resultadoVeoVeoGuardado && btn.id === 'mic2') {
        resultadoVeoVeoGuardado = true;
        guardarResultadoJuego('resonancia','veoveo',2,2,true,50,1, {
          audioTranscripcion: detalle.audioTranscripcion || texto,
          audioUrl: detalle.audioUrl || '',
          requiereRevisionAudio: true,
        });
        document.getElementById('btn-continuar-veoveo').style.display = 'block';
      }
    } else {
      btn.textContent = '🎤';
      btn.style.background = '#e63946';
      estadoEl.textContent = `Se escuchó: "${texto}". Intenta de nuevo diciendo "muñeca".`;
      estadoEl.style.color = '#d32f2f';
    }
  };
  rec.onerror = () => {
    btn.textContent = '🎤';
    btn.style.background = '#e63946';
    estadoEl.textContent = 'No se entendió bien, intenta de nuevo.';
    estadoEl.style.color = '#d32f2f';
  };
  rec.onend = () => { if (btn.dataset.done !== 'true') { btn.textContent = '🎤'; btn.style.background = '#e63946'; } };
  try { rec.start(); } catch (e) { btn.textContent = '🎤'; btn.style.background = '#e63946'; estadoEl.textContent = 'El micrófono ya estaba en uso.'; }
}
document.getElementById('mic1').addEventListener('click', () => toggleMic(document.getElementById('mic1'), document.getElementById('mic1-estado')));
document.getElementById('mic2').addEventListener('click', () => toggleMic(document.getElementById('mic2'), document.getElementById('mic2-estado')));

const btnContinuar = document.getElementById('btn-continuar-veoveo');
const modoFlujo = sessionStorage.getItem('flujo_juegos_modo') || '';
if (btnContinuar && modoFlujo === 'actividades_hoy') {
  const normalizar = (u) => (u || '').replace(/\/+$/, '');
  const actual = normalizar(window.location.pathname);
  const lista = (JSON.parse(sessionStorage.getItem('actividades_hoy_urls') || '[]') || []).map(normalizar);
  const completadas = new Set((JSON.parse(sessionStorage.getItem('actividades_hoy_completadas') || '[]') || []).map(normalizar));
  const pendientes = lista.filter((u) => !completadas.has(u) && u !== actual);
  if (pendientes.length) {
    btnContinuar.href = pendientes[0];
    btnContinuar.textContent = 'Siguiente actividad';
  } else {
    sessionStorage.setItem('flujo_juegos_modo', 'hub');
    btnContinuar.href = '/juegos/articulacion/letra-b';
    btnContinuar.textContent = 'Seguir en juegos';
  }
}
</script>
</body>
</html>
